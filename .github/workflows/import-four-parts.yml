name: Import four exact binary segments
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  segment:
    if: github.event.head_commit.message == 'Initialize four-part import'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original and split without modifying bytes
        env:
          INPUT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-0f3c-81fd-bf1a-9e117054878f/raw?se=2026-11-18T06%3A07%3A21Z&sp=r&sv=2026-06-06&sr=b&scid=779bb0b2-316b-52aa-9259-8ce57d6052d2&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T04%3A16%3A10Z&ske=2026-11-19T04%3A16%3A10Z&sks=b&skv=2026-06-06&sig=LrkfPdPlKHlkXj9HP8NK%2BU/Sd6pFjgYRQHHevzu8AoU%3D"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 240 "$INPUT_URL" -o /tmp/original.zip
          echo '503f7ca959767d531b528b89ac21b7761afa8fba1c6e1ffb9e3c41835df4a0aa  /tmp/original.zip' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          source=Path('/tmp/original.zip')
          n=source.stat().st_size
          assert n==92476071,n
          k=(n+3)//4
          paths=[]
          with source.open('rb') as f:
              for i in range(4):
                  p=Path(f'Stellar-Proximology-FULL-web.zip.part{i+1:02d}')
                  with p.open('wb') as g:
                      remaining=min(k,n-i*k)
                      while remaining:
                          chunk=f.read(min(1048576,remaining))
                          assert chunk
                          g.write(chunk)
                          remaining-=len(chunk)
                  paths.append(p)
          h=hashlib.sha256()
          for p in paths:
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1048576),b''):
                      h.update(chunk)
          assert h.hexdigest()=='503f7ca959767d531b528b89ac21b7761afa8fba1c6e1ffb9e3c41835df4a0aa'
          print('Four parts created and recombination SHA256 verified')
          PY
      - name: Commit four parts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Stellar-Proximology-FULL-web.zip.part01 Stellar-Proximology-FULL-web.zip.part02 Stellar-Proximology-FULL-web.zip.part03 Stellar-Proximology-FULL-web.zip.part04
          git commit -m "Add four lossless segments of Stellar Proximology archive"
          git push origin HEAD:main
